[env:gate]
platform = espressif32@~6.11.0 ; <-- BU SATIRI GÜNCELLEYİN VEYA EKLEYİN ; 6.11.0 is the latest


;board_build.partitions = huge_app.csv
board_build.partitions = custom_partitions.csv


extra_scripts = pre:scripts/version_script.py


board = esp32dev
upload_port = COM10
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.3.1

build_src_filter = +<gate/> +<common/>
build_flags = 
    -std=c++17
    -I src/common
    -D ENV_GATE


[env:vehicle]

;extra_scripts =  pre:version_script.py
;   Not: version_script.py gate'e ozeldir (binary'yi gate_firmware_<build>.bin yapar ve
;   kok version.json'i yazar). vehicle/ekranli'de calistirilirsa gate'in OTA artefaktini ezer.
platform = espressif32@~6.11.0
board = lolin_c3_mini
upload_port = COM6
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.3.1
board_build.partitions = huge_app.csv
build_src_filter = +<vehicle/> +<common/>
build_flags = 
    -std=c++17
    -I src/common
    -D ENV_VEHICLE


[env:ekranli]
; version_script.py bilincli olarak kapali: yalnizca gate'in OTA artefaktini uretir
; (bkz. [env:vehicle] ustundeki not). Gerekirse scripts/version_script.py once
; env-farkinda hale getirilmelidir.
platform = espressif32@~6.11.0
board = esp32dev
framework = arduino
upload_port = COM12
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.3.1
board_build.partitions = huge_app.csv
build_src_filter = +<vehicle/> +<common/>
build_flags = 
    -std=c++17
    -I src/common
    -D ENV_EKRANLI

